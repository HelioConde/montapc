name: Static QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend
        run: |
          set -e
          test -f index.html
          test -f style.css
          test -f app.js
          test -f supabase-config.js
          test -f ads-config.js
          test -f ads.js
          test -f i18n.js
          test -f scripts/capture-site.mjs
          test -f manifest.webmanifest
          test -f sw.js
          test -f pwa.js
          test -f analytics.js
          test -f robots.txt
          test -f sitemap.xml
          test -f icon.svg
          node --check app.js
          node --check supabase-config.js
          node --check ads-config.js
          node --check ads.js
          node --check i18n.js
          node --check scripts/capture-site.mjs
          node --check sw.js
          node --check pwa.js
          node --check analytics.js
          node --check live-update.js
          node --check tests/pwa-security.spec.js
          grep -q 'montapc-v3' sw.js
          grep -q 'ASSET_PATHS.has(url.pathname)' sw.js
          test -f tests/pwa-security.spec.js
          test -f supabase/migrations/20261009141528_montapc_owner_build_items_and_least_privilege.sql
          grep -qi '<title' index.html
          grep -qi 'name="description"' index.html
          grep -qi 'rel="canonical"' index.html
          grep -qi 'src="app.js"' index.html
          grep -qi 'src="supabase-config.js"' index.html
          grep -qi 'src="ads-config.js"' index.html
          grep -qi 'src="ads.js"' index.html
          grep -qi 'src="i18n.js"' index.html
          grep -q 'id="language-select"' index.html
          grep -q 'id="compare-panel"' index.html
          grep -q 'rel="manifest"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'pwa.js' index.html
          grep -q 'sitemap.xml' robots.txt
          grep -q 'hreflang="en"' index.html
          grep -q 'analytics.js' index.html

          test "$(git hash-object img/assets/cpu.png)" = "e9b5aa389a7febb75e863b6f967f8c29dbfbfe8d"
          test "$(git hash-object img/assets/gpu.png)" = "a331a1777bf10fa871798de62f3cfd844016c231"
          test "$(git hash-object img/assets/motherboard.png)" = "51ef39bcb1512ebffd85c6fdcda0b857551dcfd6"
          test "$(git hash-object img/assets/ram.png)" = "58295d5fcd29b79eaca53799fc64cd71acee42fb"
          test "$(git hash-object img/assets/ssd-nvme.png)" = "17b3cdaf43d75bd8f7e9ae0983a1a4ef6ec83a12"
          test "$(git hash-object img/assets/psu.png)" = "696c6213280a8ff73681ee7b319c1d39c4fb743b"
          test "$(git hash-object img/assets/case.png)" = "5cc01bc945c5ac5b42ea02ddb9c23c7c19a26a1f"
          test "$(git hash-object img/assets/cpu-cooler.png)" = "e200964cdb81d4f289cc70327ee326851efc6ff7"
          test "$(git hash-object img/assets/hero-build.png)" = "df517804b8602eae70b60778fff9b26f7c0d6f37"
          grep -q "'pt-BR'" i18n.js
          grep -q "'en'" i18n.js
          grep -q 'enabled: false' ads-config.js
          ! grep -q 'ideias-ia-lab/04-monta-pc' index.html
          ! grep -qi 'service_role' supabase-config.js
