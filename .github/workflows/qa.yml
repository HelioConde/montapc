name: QA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'screenshots/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/montapc.log 2>&1 &
      - name: Browser E2E
        run: npm run test:e2e
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: montapc-e2e
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
