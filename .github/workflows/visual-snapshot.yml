name: Capture Visual Snapshot

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-snapshot
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture full-page screenshots
        env:
          SCREENSHOT_URL: https://helioconde.github.io/montapc/
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npm run capture:site

      - name: Commit snapshots
        run: |
          if [ -z "$(git status --porcelain -- screenshots/)" ]; then
            echo "No visual changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          git commit -m "chore: refresh visual snapshots [skip ci]"

          for attempt in 1 2 3; do
            echo "Snapshot push attempt $attempt"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not rebase snapshot commit."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 2
          done

          echo "Could not push snapshots after retries."
          exit 1
