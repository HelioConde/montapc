name: Live version

on:
  push:
    branches: [main]
    paths-ignore:
      - version.json
      - 'screenshots/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deploy version contract
        shell: bash
        run: |
          set -euo pipefail
          test -f version.json
          node -e "const f=require('./version.json'); if (!f.sha && !f.version) process.exit(1)"
          grep -q 'Stamp deploy version' .github/workflows/pages.yml
          grep -q '\$GITHUB_SHA' .github/workflows/pages.yml
          grep -q 'live-update.js' index.html
          echo 'GitHub Pages stamps its own published revision; no bot push needed.'
